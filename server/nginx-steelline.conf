# Фрагмент для server { … } сайта steelline.store (nginx). Сгенерирован catalog-source/redirects.py — не править вручную.
#
# 1) Адреса страниц без «/» на конце, как на старом сайте: /catalog/dom/svarnie/agios → файл …/agios/index.html
location / {
    try_files $uri $uri/index.html $uri/ =404;
}

