# Автопубликация лендинга на promo.steelline.store при push в main.
#
# Секреты (GitHub → Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY     — приватный ключ пользователя deploy на сервере (целиком, с BEGIN/END)
#   DEPLOY_KNOWN_HOSTS — вывод `ssh-keyscan 147.45.213.61`

name: Публикация на promo.steelline.store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promo-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 147.45.213.61
  DEPLOY_USER: deploy
  DEPLOY_PATH: /opt/steelline-promo/site/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "Нет секрета DEPLOY_SSH_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Нет секрета DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Загрузить файлы (rsync)
        run: |
          rsync -rlz --delete --itemize-changes \
            --chmod=D755,F644 \
            --exclude '.git/' --exclude '.github/' --exclude 'server/' \
            --exclude '.gitignore' --exclude '.nojekyll' --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      # Настройки почты для send.php — ВНЕ папки сайта (её перезаписывает rsync --delete).
      # Папки config/ и leads/ и их группу (пользователь PHP) создаёт администратор сервера; здесь группу не меняем.
      # Пароль приложения Яндекса берётся из секрета MAIL_SMTP_PASS; без секрета шаг пропускается.
      - name: Настройки почты для формы
        env:
          MAIL_PASS: ${{ secrets.MAIL_SMTP_PASS }}
        run: |
          if [ -z "$MAIL_PASS" ]; then echo "Секрета MAIL_SMTP_PASS нет — настройки почты не трогаю"; exit 0; fi
          # пароль приложения Яндекса — только латинские буквы и цифры; кавычки и т.п. сломали бы PHP-файл
          printf '%s' "$MAIL_PASS" | grep -Eq '^[A-Za-z0-9]+$' || { echo "MAIL_SMTP_PASS: допустимы только латинские буквы и цифры (без пробелов)"; exit 1; }
          cat > mail.php <<PHP
          <?php
          return [
              'smtp_host'  => 'smtp.yandex.ru',
              'smtp_port'  => 465,
              'smtp_user'  => 'segimova.alena@yandex.ru',
              'smtp_pass'  => '$MAIL_PASS',
              'from_email' => 'segimova.alena@yandex.ru',
              'from_name'  => 'Сайт «Стальная линия»',
              'to' => ['alena.segimova22@mail.ru', 'segimova.alena@yandex.ru'], // astroom@steelline.store — добавить после проверки
              'leads_dir'  => '$(dirname "${DEPLOY_PATH%/}")/leads',
          ];
          PHP
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "SITE='${DEPLOY_PATH%/}'; BASE=\$(dirname \"\$SITE\");
             set -e; umask 027;
             mkdir -p \"\$BASE/config\" \"\$BASE/leads\";
             cat > \"\$BASE/config/mail.php.tmp\"; mv \"\$BASE/config/mail.php.tmp\" \"\$BASE/config/mail.php\";
             chgrp \"\$(stat -c %G \"\$BASE/config\")\" \"\$BASE/config/mail.php\" || echo 'группу файла сменить не удалось';
             chmod 640 \"\$BASE/config/mail.php\";
             echo '--- проверка ---';
             echo \"папка сайта: \$(stat -c '%U:%G' \"\$SITE\")\";
             echo \"PHP работает от: \$(ps -eo user,comm | awk '/php/ {print \$1}' | sort -u | tr '\\n' ' ')\";
             ls -ld \"\$BASE/config\" \"\$BASE/config/mail.php\" \"\$BASE/leads\"" < mail.php
          rm -f mail.php

      - name: Удалить ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
